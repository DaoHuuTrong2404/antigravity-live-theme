<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 36" fill="none">
  <defs>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="48%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Flowing constellation tail -->
  <path d="M8 24 C32 24, 50 18, 76 18" stroke="url(#goldAccent)" stroke-width="1.35" stroke-linecap="round"/>
  <path d="M24 28 C44 27, 58 22, 78 21" stroke="#c084fc" stroke-opacity="0.45" stroke-width="0.9" stroke-dasharray="2 3"/>
  <circle cx="22" cy="24" r="1.4" fill="#38bdf8" opacity="0.85"/>
  <circle cx="46" cy="21" r="1.7" fill="#f472b6" opacity="0.9"/>
  <circle cx="64" cy="18.5" r="1.3" fill="#fbbf24" opacity="0.95"/>
  <!-- Small twin star -->
  <path d="M77 11 L78.6 15.4 L83 17 L78.6 18.6 L77 23 L75.4 18.6 L71 17 L75.4 15.4 Z" fill="#38bdf8" opacity="0.9" filter="url(#softGlow)"/>
  <!-- Main 4-pointed iridescent Tawa prism star hairpin -->
  <g filter="url(#softGlow)">
    <path d="M97 3 L100.8 14.2 L112 18 L100.8 21.8 L97 33 L93.2 21.8 L82 18 L93.2 14.2 Z" fill="url(#prismGrad)" stroke="#f8fafc" stroke-width="0.9"/>
    <path d="M97 7.5 L99.2 15.8 L107.5 18 L99.2 20.2 L97 28.5 L94.8 20.2 L86.5 18 L94.8 15.8 Z" fill="#ffffff" fill-opacity="0.38"/>
    <circle cx="97" cy="18" r="2.1" fill="#fef08a"/>
  </g>
  <!-- Tiny snow crystal dots -->
  <circle cx="114" cy="10" r="1.3" fill="#e0f2fe" opacity="0.9"/>
  <circle cx="109" cy="28" r="1.1" fill="#f5d0fe" opacity="0.85"/>
</svg>
